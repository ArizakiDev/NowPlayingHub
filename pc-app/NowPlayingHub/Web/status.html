<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Now Playing Hub · Statut</title>
<style>
  :root {
    --bg:#f7f8fa; --card:#fff; --line:#e3e6ea; --text:#222831; --dim:#6b7280;
    --ok:#3aa75b; --degraded:#e0a100; --outage:#d64545; --nodata:#d5d8de; --accent:#5865f2;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e0f13; --card:#16181e; --line:#262a33; --text:#eceef2; --dim:#8b92a1; --nodata:#2f333d; --accent:#8b95ff; }
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         padding:max(20px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom)); }
  main { max-width:760px; margin:0 auto; }
  header { display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin:8px 2px 18px; flex-wrap:wrap; }
  header h1 { font-size:20px; margin:0; font-weight:600; }
  header span { color:var(--dim); font-size:13px; }
  .banner { border-radius:6px; padding:22px 24px; color:#fff; font-size:22px; font-weight:600; background:var(--nodata); transition:background .3s; }
  .banner.ok { background:var(--ok); } .banner.degraded { background:var(--degraded); } .banner.outage { background:var(--outage); }
  .banner.nodata { background:#6b7280; }
  .note { text-align:center; color:var(--dim); font-size:13px; margin:34px 8px 10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .group { padding:10px 24px 6px; font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); border-top:1px solid var(--line); background:var(--bg); }
  .group:first-child { border-top:0; }
  .comp { padding:18px 24px 14px; border-top:1px solid var(--line); }
  .group + .comp { border-top:0; }
  .row { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  .name { font-size:18px; font-weight:600; }
  .state { font-size:15px; white-space:nowrap; } .state.ok { color:var(--ok); } .state.degraded { color:var(--degraded); } .state.outage { color:var(--outage); } .state.nodata { color:var(--dim); }
  .sub { color:var(--dim); font-size:13px; min-height:18px; margin-top:2px; }
  .bars { display:flex; gap:3px; margin:10px 0 8px; height:34px; }
  .bar { flex:1; border-radius:2px; background:var(--nodata); min-width:3px; }
  .bar.ok { background:var(--ok); } .bar.degraded { background:var(--degraded); } .bar.warn { background:#e8742c; } .bar.outage { background:var(--outage); }
  .legend { display:flex; align-items:center; gap:10px; color:var(--dim); font-size:13px; }
  .legend i { flex:1; height:1px; background:var(--line); }
  h2 { font-size:18px; margin:34px 2px 12px; font-weight:600; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:6px; padding:14px 16px; }
  .tile h3 { margin:0 0 8px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); }
  .kv { display:flex; justify-content:space-between; gap:10px; font-size:14px; padding:2px 0; }
  .kv span:first-child { color:var(--dim); } .kv span:last-child { text-align:right; font-variant-numeric:tabular-nums; }
  .spark svg { width:100%; height:46px; display:block; }
  .spark .val { font-size:20px; font-weight:600; font-variant-numeric:tabular-nums; }
  .spark polyline { fill:none; stroke:var(--accent); stroke-width:2; vector-effect:non-scaling-stroke; }
  .inc { background:var(--card); border:1px solid var(--line); border-radius:6px; padding:12px 16px; margin-bottom:10px; }
  .inc b { font-weight:600; } .inc .when { color:var(--dim); font-size:13px; }
  .pill { display:inline-block; font-size:12px; padding:1px 8px; border-radius:10px; color:#fff; margin-left:8px; vertical-align:1px; }
  .pill.degraded { background:var(--degraded); } .pill.outage { background:var(--outage); }
  .empty { color:var(--dim); font-size:14px; padding:6px 2px; }
  footer { color:var(--dim); font-size:12px; text-align:center; margin-top:34px; }
</style>
</head>
<body>
<main>
  <header><h1>Now Playing Hub · Statut</h1><span id="upd">Chargement…</span></header>
  <div id="banner" class="banner nodata">Chargement…</div>
  <p class="note">Disponibilité sur les 30 derniers jours. Mesures toutes les 10 s par l'appli PC : un jour gris = appli fermée (non compté comme une panne).</p>
  <div id="comps" class="card"></div>
  <div id="cardSection" hidden>
    <h2>Carte ESP32 · détails</h2>
    <div id="details" class="grid"></div>
    <div id="sparks" class="grid" style="margin-top:12px"></div>
  </div>
  <div id="histSection" hidden>
    <h2>Écoute · 30 derniers jours</h2>
    <div id="hist" class="grid"></div>
  </div>
  <h2>Incidents récents</h2>
  <div id="incidents"></div>
  <footer id="foot"></footer>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
  function num(v, d) { return Number(v).toLocaleString('fr-FR', { maximumFractionDigits: d === undefined ? 0 : d }); }
  function dur(s) { s = Math.floor(s); var d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
    return d > 0 ? d + ' j ' + h + ' h' : h > 0 ? h + ' h ' + (m < 10 ? '0' : '') + m : m + ' min ' + (s % 60) + ' s'; }
  function when(iso) { var d = new Date(iso); return d.toLocaleString('fr-FR', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }); }
  function barClass(u) { return u === null ? '' : u >= 99.5 ? 'ok' : u >= 97 ? 'degraded' : u >= 90 ? 'warn' : 'outage'; }

  function render(s) {
    $('upd').textContent = 'Mis à jour à ' + new Date(s.generatedAt).toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
    var b = $('banner'); b.className = 'banner ' + s.overall.level; b.textContent = s.overall.text;

    var box = $('comps'); box.textContent = '';
    s.groups.forEach(function (g) {
      box.appendChild(el('div', 'group', g.name));
      g.components.forEach(function (c) {
        var d = el('div', 'comp');
        var row = el('div', 'row'); row.appendChild(el('div', 'name', c.name)); row.appendChild(el('div', 'state ' + c.level, c.text)); d.appendChild(row);
        d.appendChild(el('div', 'sub', c.note || ''));
        var bars = el('div', 'bars');
        c.days.forEach(function (x) {
          var bar = el('div', 'bar ' + barClass(x.u));
          bar.title = new Date(x.d + 'T12:00:00').toLocaleDateString('fr-FR', { day:'numeric', month:'long' }) + ' · ' +
            (x.u === null ? 'aucune mesure' : num(x.u, 2) + ' %' + (x.m > 0 ? ' · ' + num(x.m, 0) + ' min d\'indisponibilité' : ''));
          bars.appendChild(bar);
        });
        d.appendChild(bars);
        var lg = el('div', 'legend'); lg.appendChild(el('span', '', 'il y a 30 jours')); lg.appendChild(el('i'));
        lg.appendChild(el('span', '', c.uptime === null ? 'pas encore de mesure' : num(c.uptime, 2) + ' % de disponibilité'));
        lg.appendChild(el('i')); lg.appendChild(el('span', '', 'aujourd\'hui')); d.appendChild(lg);
        box.appendChild(d);
      });
    });

    var cs = $('cardSection'), c = s.card;
    cs.hidden = !c;
    if (c) {
      var tiles = [
        ['Processeur', [['Puce', (c.model || '—') + (c.rev ? ' rév. ' + c.rev : '')], ['Cœurs', c.cores || '—'], ['Fréquence', c.cpuMhz + ' MHz'], ['Température', num(c.tempC, 0) + ' °C']]],
        ['Charge', c.v19 ? [['Tour de boucle (moy.)', num(c.loopAvgMs, 2) + ' ms'], ['Pire tour (5 s)', num(c.loopWorstMs, 1) + ' ms'], ['Tours > 100 ms', c.loopSlow + ' (total ' + c.loopSlowTotal + ')'], ['Pile libre', num(c.stackFreeKB, 1) + ' Ko']] : [['Firmware', 'v' + c.version + ' : mets à jour en 1.9']]],
        ['Mémoire', [['Libre', num(c.heapKB) + ' Ko'], ['Minimum depuis le démarrage', c.v19 ? num(c.minHeapKB) + ' Ko' : '—'], ['Plus grand bloc', num(c.maxBlockKB) + ' Ko'], ['Fragmentation', c.v19 ? c.fragPct + ' %' : '—']]],
        ['Flash', c.v19 ? [['Capacité', c.flashMB + ' Mo à ' + c.flashMhz + ' MHz'], ['Firmware', num(c.sketchKB) + ' Ko'], ['Libre pour mises à jour', num(c.freeSketchKB) + ' Ko']] : [['—', '']]],
        ['Réseau', [['Signal', c.rssi + ' dBm'], ['Canal', c.v19 ? c.channel : '—']]],
        ['Système', [['Firmware', 'v' + c.version], ['Allumée depuis', dur(c.uptimeSec)], ['Dernier démarrage', c.resetReason || '—'], ['Écran affiché', c.screen || '—']]]
      ];
      var det = $('details'); det.textContent = '';
      tiles.forEach(function (t) { var d = el('div', 'tile'); d.appendChild(el('h3', '', t[0]));
        t[1].forEach(function (kv) { var r = el('div', 'kv'); r.appendChild(el('span', '', kv[0])); r.appendChild(el('span', '', String(kv[1]))); d.appendChild(r); });
        det.appendChild(d); });

      var sp = $('sparks'); sp.textContent = '';
      [['heapKB', 'Mémoire libre', ' Ko', 0], ['tempC', 'Température', ' °C', 0], ['rssi', 'Signal Wi-Fi', ' dBm', 0], ['loopMs', 'Tour de boucle', ' ms', 2]].forEach(function (m) {
        var data = (s.series && s.series[m[0]]) || [];
        var d = el('div', 'tile spark'); d.appendChild(el('h3', '', m[1] + ' · 15 min'));
        d.appendChild(el('div', 'val', data.length ? num(data[data.length - 1], m[3]) + m[2] : '—'));
        if (data.length > 1) {
          var min = Math.min.apply(null, data), max = Math.max.apply(null, data), span = (max - min) || 1;
          var pts = data.map(function (v, i) { return (i / (data.length - 1) * 100).toFixed(1) + ',' + (46 - 4 - (v - min) / span * 38).toFixed(1); }).join(' ');
          var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); svg.setAttribute('viewBox', '0 0 100 46'); svg.setAttribute('preserveAspectRatio', 'none');
          var pl = document.createElementNS('http://www.w3.org/2000/svg', 'polyline'); pl.setAttribute('points', pts); svg.appendChild(pl); d.appendChild(svg);
        }
        sp.appendChild(d);
      });
    }

    var hs = $('histSection'), h = s.history;
    hs.hidden = !h || !h.total;
    if (h && h.total) {
      var hb = $('hist'); hb.textContent = '';
      function mn(m) { return m >= 60 ? Math.floor(m / 60) + ' h ' + (m % 60) + ' min' : m + ' min'; }
      function tile(title, rows) {
        var d = el('div', 'tile'); d.appendChild(el('h3', '', title));
        if (!rows.length) rows = [['—', '']];
        rows.forEach(function (kv) { var r = el('div', 'kv'); r.appendChild(el('span', '', kv[0])); r.appendChild(el('span', '', String(kv[1]))); d.appendChild(r); });
        hb.appendChild(d);
      }
      tile('Temps d\'écoute', [['Aujourd\'hui', h.today.plays + ' titres · ' + mn(h.today.minutes)], ['7 jours', h.week.plays + ' titres · ' + mn(h.week.minutes)], ['30 jours', h.month.plays + ' titres · ' + mn(h.month.minutes)]]);
      tile('Titres les plus écoutés', h.topTracks.map(function (t) { return [t.title + (t.artist ? ' — ' + t.artist : ''), t.plays + '×']; }));
      tile('Artistes les plus écoutés', h.topArtists.map(function (a) { return [a.artist, mn(a.minutes)]; }));
      tile('Dernières écoutes', h.recent.map(function (r) { return [r.title + (r.artist ? ' — ' + r.artist : ''), r.at]; }));
    }

    var inc = $('incidents'); inc.textContent = '';
    if (!s.incidents.length) inc.appendChild(el('div', 'empty', 'Aucun incident enregistré.'));
    s.incidents.forEach(function (i) {
      var d = el('div', 'inc'); var t = el('div'); t.appendChild(el('b', '', i.component));
      t.appendChild(el('span', 'pill ' + i.level, i.level === 'outage' ? 'Indisponible' : 'Dégradé')); d.appendChild(t);
      d.appendChild(el('div', 'when', when(i.start) + (i.end ? ' → ' + when(i.end) : ' → en cours')));
      if (i.detail) d.appendChild(el('div', '', i.detail)); inc.appendChild(d);
    });
    $('foot').textContent = 'Now Playing Hub ' + s.appVersion + ' · actualisation automatique toutes les 10 s';
  }

  function load() {
    fetch('/api/status.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(render).catch(function () {
      var b = $('banner'); b.className = 'banner nodata'; b.textContent = 'Impossible de joindre l\'appli PC';
    });
  }
  load(); setInterval(load, 10000);
})();
</script>
</body>
</html>
